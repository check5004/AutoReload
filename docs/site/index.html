<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoReload — 練習ページの開き方</title><style>body{font-family:system-ui,"Yu Gothic UI",sans-serif;background:#f3f6fb;color:#172640;margin:0;padding:64px 24px;line-height:1.9}main{max-width:660px;margin:auto}h1{font-size:28px;line-height:1.5}a{color:#2258e8}ol{padding-left:24px}li{margin-bottom:12px}.button{display:inline-block;background:#2258e8;color:#fff;padding:10px 20px;border-radius:8px;text-decoration:none}</style></head><body><main><p>↻ AutoReload</p><h1>練習ページは拡張機能に内蔵しました。</h1><p>バージョン0.2.0以降は、拡張機能の設定画面またはポップアップにある「練習ページ」から開けます。Webサイトへのアクセスや別のプログラムの起動は必要ありません。</p><ol><li>下のリンクから拡張機能のZIPをダウンロードして導入・更新します。</li><li>ChromeのAutoReloadアイコンを押し、「練習ページ」を選びます。</li><li>開いたタブで、操作の記録・混雑からの復旧・自動入力を練習できます。</li></ol><p><a class="button" href="https://github.com/check5004/AutoReload/releases/latest">最新版をダウンロード</a></p><p><a href="https://github.com/check5004/AutoReload/blob/main/docs/INSTALL.md">導入・更新手順</a></p></main></body></html>
