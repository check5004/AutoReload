<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoReload</title><link rel="stylesheet" href="ui.css"><script src="core.js"></script><script src="popup.js" defer></script></head><body class="popup"><header class="brand"><span class="logo">↻</span>AutoReload<span id="version" class="version"></span></header><div class="domain-row"><div><div id="domain" class="domain-name">読み込み中…</div><small>このドメインで使う</small></div><button id="toggle" class="switch" role="switch" aria-checked="false" aria-label="このドメインでAutoReloadを有効にする" disabled></button></div><div id="status" class="status" role="status">状態を確認しています</div><div class="buttons"><button id="watch" class="primary full">復旧監視を開始</button><button id="execute">入力補助を実行</button><button id="stop" class="danger">停止</button><button id="pick">項目を覚える</button><button id="ready">復旧の目印を覚える</button></div><p class="note">操作パネルはページ端で待機します。<br>記録した日時・席種や開始時刻は設定から変更できます。</p><div class="divider"></div><div class="links"><button id="settings" class="link-button">設定・記録した操作</button><button id="tutorial" class="link-button">練習サイト ↗</button></div><div id="update" class="update" hidden><span id="update-text"></span> <a id="release" target="_blank" rel="noreferrer">リリースを見る</a><br><button id="dismiss">7日間表示しない</button></div><p id="error" class="error" role="alert"></p></body></html>
